name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: test_bot
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: test_bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_bot -d test_bot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_bot:ci_only_password@127.0.0.1:5432/test_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate deployment
        run: |
          python scripts/init_env.py
          docker compose --profile polling config --quiet
          docker compose --profile production config --quiet
          docker compose --profile admin config --quiet
          docker build -t max-ip-bot:test .
          docker run --rm max-ip-bot:test python -c "from ip_bot.forms import fill_r21001; from ip_bot.documents import make_pdf; from ip_bot.tax import compare_taxes; assert fill_r21001({}).startswith(b'%PDF-'); assert make_pdf('Тест', 'Документы').startswith(b'%PDF-'); assert len(compare_taxes({})['rows']) == 7"
          docker run --rm -e BOT_DOMAIN=bot.example.com -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --validate > /dev/null
